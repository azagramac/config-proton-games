# ==========================================
# GENERAL
# ==========================================

legacy_layout=false
position=top-left

font_size=22
font_size_secondary=13

background_alpha=0.35
round_corners=8

# ==========================================
# CPU
# ==========================================

cpu_stats
cpu_temp
cpu_mhz
cpu_color=FF9900

# ==========================================
# GPU
# ==========================================

gpu_stats
gpu_temp
gpu_mem_temp
gpu_core_clock
gpu_mem_clock
gpu_color=FF3030

# ==========================================
# VRAM
# ==========================================

vram
vram_color=AD64C1

# ==========================================
# RAM
# ==========================================

ram
ram_color=40C060

# ==========================================
# STORAGE / I/O
# ==========================================

# Corregido io_stats por las opciones válidas de la v0.7.0+
io_read
io_write

# ==========================================
# API / RENDER ENGINE
# ==========================================

engine_version
engine_color=4080FF

# ==========================================
# FPS
# ==========================================

fps
fps_metrics=avg
fps_limit=120

# ==========================================
# FRAME TIMING
# ==========================================

frametime
frame_timing=1
dynamic_frame_timing=0   # <-- CAMBIADO A 0: Evita parpadeos y desalineación visual bajo Wayland
vsync=2                  # <-- CAMBIADO A 2: Activa Mailbox (Fast Sync). Sincroniza los cortes sin añadir retraso al ratón
frametime_color=39FF14

# ==========================================
# FRAME TIME LOGGING
# ==========================================

output_folder=/home/jose/gaming-logs
log_interval=10

# ==========================================
# TEXT
# ==========================================

text_color=FFFFFF
text_outline=true
text_outline_color=000000
text_outline_thickness=1.5

